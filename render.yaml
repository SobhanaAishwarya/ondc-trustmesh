# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click deploy: connect this repo on Render and it provisions Postgres,
# Redis, the backend (Docker), and the frontend (Docker) from this file.
# Unlike docker-compose.yml's same-origin nginx proxy, Render gives each
# service its own public hostname, so the frontend is built with an
# absolute VITE_API_URL and the backend's CORS_ORIGINS is set to the
# frontend's URL explicitly — cross-origin, not same-origin.
#
# rootDir paths below are relative to this repo's root — i.e. this repo
# *is* ondc_blockchain_ai (see the root README for why: the project used
# to live inside a larger, unrelated monorepo with no remote of its own).
#
# Postgres is deliberately NOT a Render-managed `databases:` entry —
# Render's free Postgres expires 30 days after creation and is deleted
# 14 days after that (https://render.com/docs/free#free-postgresql-databases).
# DATABASE_URL instead points at a free-forever Neon instance, set as a
# `sync: false` env var below: declared here so its existence and the
# fact that it's manually managed are visible in the blueprint, but the
# actual value (a real credential) is set once via the Render
# dashboard/API and never stored in this file or git history.

services:
  - type: redis
    name: ondc-redis
    plan: free
    ipAllowList: []

  - type: web
    name: ondc-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ondc-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://ondc-frontend.onrender.com
      - key: BLOCKCHAIN_ENABLED
        value: "false"

  - type: web
    name: ondc-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render passes envVars as Docker --build-arg values automatically for
    # docker-runtime services, matched against the Dockerfile's `ARG`
    # instructions (here, `ARG VITE_API_URL` — see frontend/Dockerfile).
    # There's no separate "build args" field; this is the same envVars
    # mechanism the backend service above uses for its runtime env vars.
    #
    # This URL is the *real* assigned backend hostname, not the
    # "ondc-backend" placeholder — Render appended "-5kxh" on first
    # deploy because the plain name was already taken by another Render
    # account (hostnames are global, not per-account). Render has no
    # Blueprint mechanism to reference another web service's *public*
    # URL dynamically (fromService's `host` property is the internal
    # hostname, not the onrender.com one a browser can reach) — this has
    # to be hardcoded and re-confirmed if the backend service is ever
    # renamed or recreated. If you fork this repo, deploy once, check
    # what hostname Render actually assigned the backend, then update
    # this value and redeploy the frontend.
    envVars:
      - key: VITE_API_URL
        value: https://ondc-backend-5kxh.onrender.com/api/v1
