server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path not matching a real file falls back to
    # index.html so React Router (not nginx) resolves e.g. /buyer/orders.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access — avoids configuring CORS for the
    # containerized deployment. "backend" is the service name in
    # docker-compose.yml; Docker's embedded DNS (127.0.0.11) resolves it.
    #
    # Proxy_pass targets a variable, not a bare hostname, deliberately:
    # nginx resolves a bare-hostname upstream once, at config-load time,
    # and refuses to start at all if it doesn't resolve ("host not found
    # in upstream") — fatal on Render, where each service is on its own
    # network and "backend" doesn't exist (the frontend there is built
    # with an absolute VITE_API_URL and never hits this location at all —
    # see render.yaml). A variable defers resolution to request time, so
    # nginx starts fine either way; this location simply 502s if actually
    # hit somewhere "backend" truly isn't resolvable, instead of taking
    # the whole container down before it can serve anything.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/health;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
