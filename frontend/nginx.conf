server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path not matching a real file falls back to
    # index.html so React Router (not nginx) resolves e.g. /buyer/orders.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access — avoids configuring CORS for the
    # containerized deployment. "backend" is the service name in
    # docker-compose.yml; Docker's embedded DNS resolves it.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
